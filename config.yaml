# My Slow News Configuration

sources:
  reddit:
    subreddits:
      - ClaudeAI
      - omarchy
      - mpcusers
      - AbletonMove
    posts_per_subreddit: 5
    lookback_hours: 24
    min_relative_score: 1.0  # multiplier of subreddit average
    max_comments_per_post: 50
    use_old_reddit: true  # Prefer old.reddit.com for scraping
    scraping_delay_ms: 500  # Minimum delay between requests

llm:
  provider: anthropic
  model: anthropic/claude-sonnet-4-20250514
  daily_budget_usd: 5.0

output:
  digest_dir: ./digests
  format: markdown

database:
  url: ws://localhost:8000/rpc
  namespace: myslownews
  database: main
  # Credentials are loaded from environment variables:
  # SURREALDB_USERNAME (required)
  # SURREALDB_PASSWORD (required)
