# My Slow News Configuration

sources:
  reddit:
    subreddits:
      - ClaudeAI
      - omarchy
      - mpcusers
      - AbletonMove
    posts_per_subreddit: 5
    lookback_hours: 24
    min_relative_score: 1.0  # multiplier of subreddit average
    max_comments_per_post: 50
    use_old_reddit: true  # Prefer old.reddit.com for scraping
    scraping_delay_ms: 500  # Minimum delay between requests

llm:
  provider: anthropic
  model: anthropic/claude-sonnet-4-20250514
  daily_budget_usd: 5.0

output:
  digest_dir: ./digests
  format: markdown

database:
  url: ws://localhost:8666/rpc
  namespace: myslownews
  database: main
  # Credentials are loaded from environment variables:
  # SURREALDB_USERNAME (required)
  # SURREALDB_PASSWORD (required)

# Summarization feature flags
summarization:
  comment_selection:
    top_scored_weight: 0.4
    replied_to_weight: 0.2
    controversial_weight: 0.2
    contrarian_weight: 0.2

  hierarchical:
    enabled: true
    min_comments_threshold: 20
    max_threads: 5

  controversy:
    enabled: true
    use_cot: true
    threshold: 0.5

  theme_synthesis:
    enabled: true
    min_posts: 3

# Link fetching for external content
link_fetching:
  enabled: true
  timeout_ms: 10000
  max_content_length: 5000
  allowed_domains: []
  blocked_domains:
    - twitter.com
    - x.com
    - facebook.com
    - instagram.com
    - tiktok.com

# Digest generation configuration
digest:
  format: markdown
  # "What Matters" section configuration
  what_matters:
    max_topics: 6
  # Top discussions section
  top_discussions:
    max_posts: 10
    min_score: 10
    min_comments: 5
  # Notable threads within discussions
  notable_threads:
    max_per_post: 3
    min_score: 5
  # Claims display settings
  claims:
    min_confidence: 0.8
    max_per_post: 3
    show_verification_marks: true
  # Importance ranking configuration
  importance_ranking:
    enabled: true                 # Enable AI-powered importance ranking
    low_activity_percentile: 20   # Bottom 20% marked as low-activity (collapsed in digest)
    use_ai_ranking: true          # Use AI for ranking (vs heuristic-only)

# Embedding configuration for semantic features
embeddings:
  provider: openai  # 'openai' or 'ollama'
  model: text-embedding-3-small
  dimensions: 1536  # OpenAI supports: 512, 1536, 3072
  cache_enabled: true
  cache_size: 10000
  batch_size: 100
  # OpenAI requires OPENAI_API_KEY environment variable
  # For Ollama, set OLLAMA_BASE_URL (defaults to http://localhost:11434)

# Semantic features configuration
semantic:
  deduplication:
    enabled: true
    similarity_threshold: 0.92  # Claims above this are duplicates
    related_threshold: 0.75     # Claims above this are related

  # Related claims shown in digest output
  related_in_digest:
    enabled: true              # Enable related claims in digest
    per_claim_limit: 2          # Max related claims per new claim
    min_similarity: 0.65        # Minimum similarity threshold

  # Contradiction detection in digest output
  contradictions:
    enabled: true              # Enable contradiction detection
    min_similarity: 0.7         # Min similarity to consider for contradiction
    use_llm_verification: true  # Use LLM to verify semantic contradictions
    max_in_digest: 5            # Max contradictions to show in digest
